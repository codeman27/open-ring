[package]
name = "oura-wasm"
description = "WebAssembly bridge exposing open_oura's pure protocol layer to the PWA"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oura-protocol = { path = "../../open_oura/crates/oura-protocol" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
